# Docker Compose for Envision Chess Academy LMS.
# Designed to plug into the existing Hostinger root project (n8n + Traefik).
# It joins the external network `root_default` so the existing Traefik
# (root-traefik-1) can route to it.
#
# Deploy from the VPS terminal:
#   cd /opt/envision-lms
#   docker compose up -d --build
#
# Requires `.env` with at least: LMS_HOST, MONGODB_URI, AUTH_SECRET,
# RAZORPAY_* keys, NEXT_PUBLIC_RAZORPAY_KEY_ID.

services:
  engine-redis:
    image: redis:7.4.2-alpine
    container_name: envision-engine-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - engine_redis_data:/data
    networks:
      - engine_internal

  envision-lms:
    container_name: envision-lms
    build: .
    restart: always
    env_file:
      - .env
    environment:
      REDIS_URL: redis://engine-redis:6379
    expose:
      - "3000"
    networks:
      - root_default
      - engine_internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.envision.rule=Host(`${LMS_HOST}`)"
      - "traefik.http.routers.envision.entrypoints=web,websecure"
      - "traefik.http.routers.envision.tls=true"
      - "traefik.http.routers.envision.tls.certresolver=mytlschallenge"
      - "traefik.http.services.envision.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.envision.headers.SSLRedirect=true"
      - "traefik.http.middlewares.envision.headers.STSSeconds=315360000"
      - "traefik.http.middlewares.envision.headers.browserXSSFilter=true"
      - "traefik.http.middlewares.envision.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.envision.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.envision.headers.SSLHost=${LMS_HOST}"
      - "traefik.http.middlewares.envision.headers.STSIncludeSubdomains=true"
      - "traefik.http.middlewares.envision.headers.STSPreload=true"
      - "traefik.http.routers.envision.middlewares=envision@docker"

  fishnet-01:
    image: niklasf/fishnet:2.14.0
    container_name: envision-fishnet-01
    restart: always
    shm_size: 256m
    environment:
      ENDPOINT: http://envision-lms:3000/fishnet
      KEY: ${FISHNET_1_KEY}
      CORES: 2
    depends_on:
      - envision-lms
    networks: [engine_internal]

  fishnet-02:
    image: niklasf/fishnet:2.14.0
    container_name: envision-fishnet-02
    restart: always
    shm_size: 256m
    environment:
      ENDPOINT: http://envision-lms:3000/fishnet
      KEY: ${FISHNET_2_KEY}
      CORES: 2
    depends_on:
      - envision-lms
    networks: [engine_internal]

  fishnet-03:
    image: niklasf/fishnet:2.14.0
    container_name: envision-fishnet-03
    restart: always
    shm_size: 256m
    environment:
      ENDPOINT: http://envision-lms:3000/fishnet
      KEY: ${FISHNET_3_KEY}
      CORES: 2
    depends_on:
      - envision-lms
    networks: [engine_internal]

networks:
  root_default:
    external: true
  engine_internal:
    driver: bridge

volumes:
  engine_redis_data:
