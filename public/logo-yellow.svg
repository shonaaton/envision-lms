<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <style>
      .word { font-family: "Bangers", "Komika Title", "Impact", "Arial Black", sans-serif; font-weight: 700; }
    </style>
  </defs>
  <!-- ENV -->
  <text x="50" y="160" class="word" font-size="170" fill="#fde75a" transform="skewX(-6)">ENV</text>

  <!-- Chess king with eye -->
  <g transform="translate(370 30)" fill="none" stroke="#fde75a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- Cross on top -->
    <line x1="60" y1="0" x2="60" y2="34" />
    <line x1="46" y1="14" x2="74" y2="14" />
    <!-- Crown / head -->
    <path d="M30 50 Q30 36 60 34 Q90 36 90 50 L90 70 L30 70 Z" />
    <!-- Neck -->
    <path d="M40 70 L80 70 L80 88 L40 88 Z" />
    <!-- Body (rounded base) -->
    <path d="M10 88 L110 88 L96 200 Q60 218 24 200 Z" />
    <!-- Base ring -->
    <line x1="0" y1="200" x2="120" y2="200" />
    <line x1="6" y1="218" x2="114" y2="218" />
    <!-- Eye replacing the I (centered on body) -->
    <ellipse cx="60" cy="135" rx="32" ry="18" />
    <circle cx="60" cy="135" r="8" fill="#fde75a" />
  </g>

  <!-- SION -->
  <text x="490" y="160" class="word" font-size="170" fill="#fde75a" transform="skewX(-6)">SION</text>

  <!-- CHESS ACADEMY -->
  <text x="180" y="240" class="word" font-size="64" fill="#fde75a" letter-spacing="4" transform="skewX(-6)">CHESS ACADEMY</text>
</svg>
