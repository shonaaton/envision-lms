<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Gukesh vs Sindarov: tale of the tape before the 2026 World Chess Championship</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a0936"/><stop offset="1" stop-color="#5a1372"/>
    </linearGradient>
    <pattern id="sq" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#ffffff" fill-opacity="0.035"/><rect x="40" y="40" width="40" height="40" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="760" rx="28" fill="url(#sq)"/>
  <text x="600" y="62" text-anchor="middle" fill="#fde75a" font-size="22" font-weight="800" letter-spacing="5">FIDE WORLD CHESS CHAMPIONSHIP 2026 · GENEVA</text>
  <text x="300" y="138" text-anchor="middle" fill="#ffffff" font-size="54" font-weight="900">D. Gukesh</text>
  <text x="300" y="176" text-anchor="middle" fill="#e8d4f0" font-size="24" font-weight="700">India · World Champion</text>
  <text x="900" y="138" text-anchor="middle" fill="#ffffff" font-size="54" font-weight="900">J. Sindarov</text>
  <text x="900" y="176" text-anchor="middle" fill="#e8d4f0" font-size="24" font-weight="700">Uzbekistan · Challenger</text>
  <circle cx="600" cy="140" r="44" fill="#fde75a"/>
  <text x="600" y="155" text-anchor="middle" fill="#2a0936" font-size="40" font-weight="900">vs</text>
  <g font-size="40" font-weight="900" fill="#ffffff">
    <rect x="60" y="215" width="1080" height="2" fill="#ffffff" fill-opacity="0.15"/>
    <text x="300" y="282" text-anchor="middle">2710</text><text x="900" y="282" text-anchor="middle" fill="#fde75a">2782</text>
    <rect x="60" y="315" width="1080" height="2" fill="#ffffff" fill-opacity="0.15"/>
    <text x="300" y="382" text-anchor="middle">No. 26</text><text x="900" y="382" text-anchor="middle" fill="#fde75a">No. 4</text>
    <rect x="60" y="415" width="1080" height="2" fill="#ffffff" fill-opacity="0.15"/>
    <text x="300" y="482" text-anchor="middle">0</text><text x="900" y="482" text-anchor="middle" fill="#fde75a">2</text>
    <rect x="60" y="515" width="1080" height="2" fill="#ffffff" fill-opacity="0.15"/>
    <text x="300" y="582" text-anchor="middle" font-size="32">Won 2024 title 7½–6½</text><text x="900" y="582" text-anchor="middle" font-size="32">Won Candidates 10/14</text>
    <rect x="60" y="615" width="1080" height="2" fill="#ffffff" fill-opacity="0.15"/>
    <text x="300" y="682" text-anchor="middle">~25%</text><text x="900" y="682" text-anchor="middle" fill="#fde75a">~75%</text>
  </g>
  <g font-size="19" font-weight="800" fill="#d0a8e1" text-anchor="middle" letter-spacing="2">
    <text x="600" y="276">FIDE RATING</text><text x="600" y="300" font-size="15" letter-spacing="1">NOV 2026</text>
    <text x="600" y="376">WORLD RANK</text>
    <text x="600" y="468">CLASSICAL WINS</text><text x="600" y="492" font-size="15" letter-spacing="1">VS EACH OTHER · 1 DRAW</text>
    <text x="600" y="568">HOW THEY</text><text x="600" y="592">GOT HERE</text>
    <text x="600" y="668">BOOKMAKER</text><text x="600" y="692" font-size="15" letter-spacing="1">CHANCE · 17 NOV</text>
  </g>
  <text x="600" y="738" text-anchor="middle" fill="#e8d4f0" fill-opacity="0.75" font-size="15">Sources: FIDE rating list (Nov 2026), Wikipedia, OLBG (bet365 prices, 17 Nov 2026). envisionchessacademy.com</text>
</svg>
